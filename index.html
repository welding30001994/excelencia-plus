<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAYDEN COMPAÑY</title>
    <!-- Agregar jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(1.8em, 4vw, 2.5em);
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: clamp(0.9em, 2.5vw, 1.1em);
        }

        .search-section {
            padding: 20px;
            background: #f8f9fa;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            .search-box {
                flex-direction: row;
            }
        }

        #codigoInput {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #codigoInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #buscarBtn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            min-width: 120px;
        }

        #buscarBtn:hover {
            transform: translateY(-2px);
        }

        .cliente-section {
            padding: 15px 20px;
            background: #e8f4fc;
            border-bottom: 2px solid #d1ecf1;
        }

        .cliente-input {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (min-width: 768px) {
            .cliente-input {
                flex-direction: row;
                align-items: center;
            }
        }

        .cliente-input label {
            font-weight: bold;
            color: #2c3e50;
            min-width: 120px;
        }

        #nombreCliente {
            flex: 1;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #nombreCliente:focus {
            outline: none;
            border-color: #3498db;
        }

        .result-section {
            padding: 20px;
            display: none;
        }

        .producto-info {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border-left: 5px solid #667eea;
            margin-bottom: 15px;
        }

        .precios {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        @media (min-width: 480px) {
            .precios {
                grid-template-columns: 1fr 1fr;
            }
        }

        .precio-card {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .precio-card.mayor {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .precio-card.seleccionado {
            border: 3px solid #2ecc71;
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }

        .precio-card h3 {
            font-size: clamp(0.9em, 3vw, 1.1em);
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .precio-valor {
            font-size: clamp(1.5em, 4vw, 2em);
            font-weight: bold;
        }

        .seleccion-actual {
            margin-top: 15px;
            padding: 12px;
            background: #e8f8f5;
            border-radius: 8px;
            border-left: 4px solid #2ecc71;
            text-align: center;
            font-weight: bold;
            color: #27ae60;
            display: none;
        }

        .comparacion-precios {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #667eea;
            display: none;
        }

        .comparacion-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 8px;
            background: white;
            border-radius: 5px;
        }

        .cantidad-section {
            margin: 15px 0;
            text-align: center;
        }

        .cantidad-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-cantidad {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cantidad:hover {
            transform: scale(1.1);
        }

        .btn-cantidad:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .cantidad-display {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .agregar-carrito {
            margin-top: 15px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .agregar-carrito:hover {
            transform: translateY(-2px);
        }

        .agregar-carrito:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .carrito-section {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
        }

        .carrito-header {
            margin-bottom: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 768px) {
            .carrito-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .carrito-items {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .carrito-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        @media (min-width: 768px) {
            .carrito-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .item-info {
            flex: 1;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .item-controls {
                justify-content: flex-end;
            }
        }

        .cantidad-carrito {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            flex-wrap: wrap;
        }

        .btn-cantidad-carrito {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cantidad-carrito-display {
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        .carrito-totales {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }

        .carrito-totales h3 {
            font-size: clamp(1.2em, 3vw, 1.5em);
            margin-bottom: 8px;
        }

        .total-comparativo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        .total-venta, .total-mayor {
            padding: 8px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
        }

        .seleccion-whatsapp {
            background: #e8f4fc;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .opciones-whatsapp {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-whatsapp-opcion {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
        }

        .btn-whatsapp-venta {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }

        .btn-whatsapp-mayor {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        .btn-whatsapp-opcion:hover {
            transform: translateY(-2px);
        }

        .carrito-acciones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 480px) {
            .carrito-acciones {
                flex-direction: row;
            }
        }

        .btn-pdf {
            flex: 1;
            padding: 12px 15px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-pdf:hover {
            transform: translateY(-2px);
        }

        .btn-guardar-pdf {
            flex: 1;
            padding: 12px 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-guardar-pdf:hover {
            transform: translateY(-2px);
        }

        .btn-guardar {
            padding: 8px 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-cargar {
            padding: 8px 15px;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-limpiar {
            padding: 8px 15px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .documentos-section {
            padding: 20px;
            background: #f8f9fa;
            border-top: 2px solid #e9ecef;
            display: none;
        }

        .documentos-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .documentos-header h3 {
            color: #2c3e50;
        }

        .filtro-documentos {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #buscarDocumento {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            width: 200px;
        }

        #buscarDocumento:focus {
            outline: none;
            border-color: #3498db;
        }

        .documentos-lista {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .documento-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-left: 4px solid #3498db;
            transition: transform 0.2s;
        }

        .documento-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .documento-info {
            flex: 1;
        }

        .documento-nombre {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .documento-detalles {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #7f8c8d;
            flex-wrap: wrap;
        }

        .documento-cliente {
            background: #e8f4fc;
            padding: 3px 8px;
            border-radius: 4px;
            color: #2980b9;
        }

        .documento-fecha {
            background: #f8f9fa;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .documento-productos {
            background: #f0f8f0;
            padding: 3px 8px;
            border-radius: 4px;
            color: #27ae60;
        }

        .documento-acciones {
            display: flex;
            gap: 8px;
        }

        .btn-abrir-documento {
            padding: 8px 15px;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s;
        }

        .btn-abrir-documento:hover {
            transform: translateY(-2px);
        }

        .btn-cargar-documento {
            padding: 8px 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.2s;
        }

        .btn-cargar-documento:hover {
            transform: translateY(-2px);
        }

        .btn-eliminar-documento {
            padding: 8px 12px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-eliminar-documento:hover {
            background: linear-gradient(135deg, #c0392b, #a93226);
        }

        .sin-documentos {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
        }

        .sin-documentos i {
            font-size: 3em;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        .error-message {
            background: #ffeaa7;
            color: #d63031;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border-left: 5px solid #fd79a8;
            margin: 10px 0;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1em;
        }

        .ejemplos {
            margin-top: 15px;
            font-size: 0.9em;
            color: #666;
            text-align: center;
        }

        .ejemplos-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
        }

        .ejemplos span {
            background: #e9ecef;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.85em;
        }

        .ejemplos span:hover {
            background: #dee2e6;
        }

        .eliminar-item {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tipo-precio {
            font-size: 0.8em;
            opacity: 0.8;
        }

        .subtotal {
            font-weight: bold;
            color: #2c3e50;
            font-size: 0.9em;
        }

        /* Animaciones */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Scrollbar personalizado */
        .carrito-items::-webkit-scrollbar,
        .documentos-lista::-webkit-scrollbar {
            width: 6px;
        }

        .carrito-items::-webkit-scrollbar-track,
        .documentos-lista::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .carrito-items::-webkit-scrollbar-thumb,
        .documentos-lista::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .carrito-items::-webkit-scrollbar-thumb:hover,
        .documentos-lista::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        /* Estilos para el visor de documentos */
        .visor-documento {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .visor-contenido {
            background: white;
            border-radius: 10px;
            width: 90%;
            height: 90%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .visor-header {
            padding: 15px 20px;
            background: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .visor-body {
            flex: 1;
            padding: 20px;
            overflow: auto;
        }

        .btn-cerrar {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-cerrar:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 COMERCIAL EXCELENCIA </h1>
            <p>Consulta precios y arma tu pedido</p>
        </div>

        <div class="cliente-section">
            <div class="cliente-input">
                <label for="nombreCliente">👤 Nombre del Cliente:</label>
                <input 
                    type="text" 
                    id="nombreCliente" 
                    placeholder="Ingresa el nombre del cliente"
                    autocomplete="off"
                >
            </div>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="codigoInput" 
                    placeholder="Ingresa el código del producto (ej: JD1000, JD5000)"
                    autocomplete="off"
                >
                <button id="buscarBtn">Buscar</button>
            </div>
            
            <div class="ejemplos">
                <strong>Ejemplos de códigos:</strong>
                <div class="ejemplos-container">
                    <span onclick="usarEjemplo('HD4153')">HD4153</span>
                    <span onclick="usarEjemplo('HD122')">HD122</span>
                    <span onclick="usarEjemplo('HD3371')">HD3371</span>
                    <span onclick="usarEjemplo('HD2376')">HD2376</span>
                </div>
            </div>
        </div>

        <div class="result-section" id="resultSection">
            <!-- Aquí se mostrarán los resultados -->
        </div>

        <div class="carrito-section" id="carritoSection" style="display: none;">
            <div class="carrito-header">
                <div>
                    <h2>🛒 Carrito de Compras</h2>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-guardar" onclick="guardarCarrito()">
                        <span>💾</span>
                        <span>Guardar</span>
                    </button>
                    <button class="btn-cargar" onclick="cargarCarrito()">
                        <span>📂</span>
                        <span>Cargar</span>
                    </button>
                </div>
            </div>
            
            <div class="carrito-items" id="carritoItems">
                <!-- Aquí se mostrarán los items del carrito -->
            </div>

            <div class="carrito-totales" id="carritoTotal">
                <h3>Comparación de Totales</h3>
                
                <div class="total-comparativo">
                    <div class="total-venta">
                        <h4>💰 Total Venta</h4>
                        <div id="totalVenta" style="font-size: 1.8em; font-weight: bold;">$0.00</div>
                    </div>
                    <div class="total-mayor">
                        <h4>🏢 Total Mayor</h4>
                        <div id="totalMayor" style="font-size: 1.8em; font-weight: bold;">$0.00</div>
                    </div>
                </div>
            </div>

            <div class="seleccion-whatsapp" id="seleccionWhatsapp" style="display: none;">
                <h4>📱 ¿Cómo quieres enviar el pedido por WhatsApp?</h4>
                <div class="opciones-whatsapp">

                return;
            }

            // Mostrar loading
            resultSection.innerHTML = '<div class="loading">Buscando producto...</div>';
            resultSection.style.display = 'block';

            productoActual = null;
            tipoPrecioSeleccionado = null;
            cantidadActual = 1;

            setTimeout(() => {
                const producto = productos[codigo];
                
                if (producto) {
                    productoActual = { ...producto, codigo: codigo };
                    mostrarResultado(producto, codigo);
                } else {
                    mostrarError('Producto no encontrado. Verifica el código.');
                }
            }, 500);

        // Función para mostrar resultado
        function mostrarResultado(producto, codigo) {

                            <div class="precio-valor">$${producto.rgn1.toFixed(2)}</div>
                        </div>
                        <div class="precio-card mayor" onclick="seleccionarPrecio('mayor')" id="precioMayor">
                            <h3>🏢 Precio Mayor (RGN2)</h3>
                            <div class="precio-valor">$${producto.rgn2.toFixed(2)}</div>
                        </div>

                        <h4>💰 Comparación de Precios (${cantidadActual} unidad${cantidadActual !== 1 ? 'es' : ''})</h4>
                        <div class="comparacion-item">
                            <span>Precio Venta:</span>
                            <span><strong>$${(producto.rgn1 * cantidadActual).toFixed(2)}</strong></span>
                        </div>
                        <div class="comparacion-item">
                            <span>Precio Mayor:</span>
                            <span><strong>$${(producto.rgn2 * cantidadActual).toFixed(2)}</strong></span>

                            <button class="btn-cantidad" onclick="cambiarCantidad(1)">+</button>
                        </div>
                    </div>

                    <button class="agregar-carrito" id="btnAgregarCarrito" disabled onclick="agregarAlCarrito()">

                    </button>
                </div>
            `;
            
            resultSection.innerHTML = html;

        // Función para cambiar cantidad
        function cambiarCantidad(cambio) {
            cantidadActual += cambio;
            
            // No permitir cantidades menores a 1
            if (cantidadActual < 1) {
                cantidadActual = 1;
            }
            
            // Actualizar display
            document.getElementById('cantidadDisplay').textContent = cantidadActual;
            
            // Actualizar botón de agregar al carrito
            const btnAgregar = document.getElementById('btnAgregarCarrito');
            btnAgregar.textContent = `🛒 Agregar al Carrito (${cantidadActual} unidad${cantidadActual !== 1 ? 'es' : ''})`;
            
            // Actualizar botones de cantidad
            document.querySelector('.btn-cantidad').disabled = cantidadActual <= 1;
            
            // Actualizar comparación de precios si hay producto seleccionado
            if (productoActual && tipoPrecioSeleccionado) {
                actualizarComparacionPrecios();
            }
        }

        // Función para actualizar comparación de precios
        function actualizarComparacionPrecios() {
            const comparacionDiv = document.getElementById('comparacionPrecios');
            if (comparacionDiv && productoActual) {
                const ventaTotal = (productoActual.rgn1 * cantidadActual).toFixed(2);
                const mayorTotal = (productoActual.rgn2 * cantidadActual).toFixed(2);
                
                comparacionDiv.innerHTML = `
                    <h4>💰 Comparación de Precios (${cantidadActual} unidad${cantidadActual !== 1 ? 'es' : ''})</h4>
                    <div class="comparacion-item">

                        <span><strong>$${mayorTotal}</strong></span>
                    </div>
                `;
                comparacionDiv.style.display = 'block';
            }
        }

        // Función para seleccionar tipo de precio
        function seleccionarPrecio(tipo) {
            tipoPrecioSeleccionado = tipo;
            
            // Remover selección anterior
            document.querySelectorAll('.precio-card').forEach(card => {
                card.classList.remove('seleccionado');
            });
            
            // Agregar selección actual
            if (tipo === 'venta') {
                document.getElementById('precioVenta').classList.add('seleccionado');
            } else {
                document.getElementById('precioMayor').classList.add('seleccionado');
            }
            
            // Mostrar selección actual
            const seleccionDiv = document.getElementById('seleccionActual');
            const tipoTexto = tipo === 'venta' ? 'Precio Venta' : 'Precio Mayor';
            document.getElementById('tipoSeleccionado').textContent = tipoTexto;
            seleccionDiv.style.display = 'block';
            
            // Mostrar comparación
            document.getElementById('comparacionPrecios').style.display = 'block';
            
            // Actualizar comparación
            actualizarComparacionPrecios();
            
            // Habilitar botón de agregar al carrito
            document.getElementById('btnAgregarCarrito').disabled = false;
        }

        // Función para agregar producto al carrito
        function agregarAlCarrito() {
            if (!productoActual || !tipoPrecioSeleccionado) {
                mostrarError('Por favor, selecciona un tipo de precio');
                return;
            }

            const itemCarrito = {
                codigo: productoActual.codigo,
                nombre: productoActual.nombre,
                rgn1: productoActual.rgn1,
                rgn2: productoActual.rgn2,
                cantidad: cantidadActual
            };

            carrito.push(itemCarrito);
            guardarDatosEnStorage(); // Guardar en Local Storage
            actualizarCarrito();
            mostrarMensajeExito(`Agregado: ${cantidadActual} ${cantidadActual !== 1 ? 'unidades' : 'unidad'} de ${productoActual.nombre}`);
            
            // Resetear cantidad
            cantidadActual = 1;
        }

        // Función para actualizar carrito
        function actualizarCarrito() {
            if (carrito.length === 0) {
                carritoSection.style.display = 'none';
                seleccionWhatsapp.style.display = 'none';
                return;
            }

            carritoSection.style.display = 'block';
            seleccionWhatsapp.style.display = 'block';
            
            // Actualizar items del carrito
            carritoItems.innerHTML = '';
            let totalVenta = 0;
            let totalMayor = 0;

            carrito.forEach((item, index) => {
                const subtotalVenta = item.rgn1 * item.cantidad;
                const subtotalMayor = item.rgn2 * item.cantidad;
                
                totalVenta += subtotalVenta;
                totalMayor += subtotalMayor;

            document.getElementById('totalMayor').textContent = `$${totalMayor.toFixed(2)}`;

        // Función para cambiar cantidad en el carrito
        function cambiarCantidadCarrito(index, cambio) {
            carrito[index].cantidad += cambio;
            
            // No permitir cantidades menores a 1
            if (carrito[index].cantidad < 1) {
                carrito[index].cantidad = 1;
            }
            
            guardarDatosEnStorage(); // Guardar cambios en Local Storage
            actualizarCarrito();
        }

        // Función para eliminar item del carrito
        function eliminarDelCarrito(index) {
            const productoEliminado = carrito[index].nombre;
            carrito.splice(index, 1);
            
            guardarDatosEnStorage(); // Actualizar Local Storage
            actualizarCarrito();
            mostrarMensajeExito(`Eliminado: ${productoEliminado}`);

        // Función para guardar datos en Local Storage
        function guardarDatosEnStorage() {
            const datos = {
                carrito: carrito,
                nombreCliente: nombreClienteInput.value
            };
            localStorage.setItem('jaydenDatos', JSON.stringify(datos));
        }

        // Función para cargar datos desde Local Storage
        function cargarDatosGuardados() {
            const datosGuardados = localStorage.getItem('jaydenDatos');
            if (datosGuardados) {
                const datos = JSON.parse(datosGuardados);
                carrito = datos.carrito || [];
                nombreClienteInput.value = datos.nombreCliente || '';
                
                if (carrito.length > 0) {
                    actualizarCarrito();
                }
            }
        }

            guardarDatosEnStorage();
            mostrarMensajeExito('Carrito guardado correctamente');

            mostrarMensajeExito('Carrito cargado correctamente');
        }

        // Función para limpiar carrito
        function limpiarCarrito() {
            carrito = [];
            localStorage.removeItem('jaydenDatos');
            actualizarCarrito();
            mostrarMensajeExito('Carrito limpiado');
        }

        // Función para generar PDF con formato mejorado
        function generarPDF() {
            if (carrito.length === 0) {
                mostrarError('El carrito está vacío');
                return null;
            }

            const nombreCliente = nombreClienteInput.value || '';
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Configuración del PDF
            let yPos = 20;
            
            // Título
            doc.setFontSize(16);
            doc.setTextColor(44, 62, 80);
            doc.text('JAYDEN COMPAÑY', 105, yPos, { align: 'center' });
            yPos += 10;
            
            // Cliente (solo si hay nombre)
            if (nombreCliente) {
                doc.setFontSize(12);
                doc.text(`Cliente: ${nombreCliente}`, 20, yPos);
                yPos += 8;
            }
            
            // Fecha
            doc.setFontSize(12);
            doc.setTextColor(100, 100, 100);
            const fecha = new Date().toLocaleDateString('es-ES', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            doc.text(`Fecha: ${fecha}`, 20, yPos);
            yPos += 15;
            
            // Encabezado de la tabla con cuadros
            doc.setFontSize(10);
            doc.setTextColor(255, 255, 255);
            doc.setFillColor(44, 62, 80);
            
            // Dibujar cuadros para encabezado
            doc.rect(10, yPos - 5, 190, 8, 'F');
            
            // Texto del encabezado
            doc.text('Producto', 15, yPos + 2);
            doc.text('Cant.', 60, yPos + 2);
            doc.text('Precio Venta', 80, yPos + 2);
            doc.text('Precio Mayor', 110, yPos + 2);
            doc.text('Subtotal Venta', 140, yPos + 2);
            doc.text('Subtotal Mayor', 170, yPos + 2);
            yPos += 10;
            
            // Datos de los productos con cuadros
            doc.setFontSize(10);
            doc.setTextColor(0, 0, 0);
            
            let totalVenta = 0;
            let totalMayor = 0;
            
            carrito.forEach((item, index) => {
                if (yPos > 270) {
                    doc.addPage();
                    yPos = 20;
                }
                
                const subtotalVenta = item.rgn1 * item.cantidad;
                const subtotalMayor = item.rgn2 * item.cantidad;
                
                totalVenta += subtotalVenta;
                totalMayor += subtotalMayor;
                
                // Fondo alternado para filas
                if (index % 2 === 0) {
                    doc.setFillColor(245, 245, 245);
                    doc.rect(10, yPos - 3, 190, 10, 'F');
                }
                
                // Dibujar bordes para cada celda
                doc.setDrawColor(200, 200, 200);
                
                // Producto
                doc.setFillColor(255, 255, 255);
                doc.rect(10, yPos - 3, 45, 10);
                doc.text(item.nombre, 15, yPos + 2);
                
                // Cantidad
                doc.rect(55, yPos - 3, 20, 10);
                doc.text(item.cantidad.toString(), 60, yPos + 2, { align: 'center' });
                
                // Precio Venta
                doc.rect(75, yPos - 3, 30, 10);
                doc.text(`$${item.rgn1.toFixed(2)}`, 80, yPos + 2, { align: 'center' });
                
                // Precio Mayor
                doc.rect(105, yPos - 3, 30, 10);
                doc.text(`$${item.rgn2.toFixed(2)}`, 110, yPos + 2, { align: 'center' });
                
                // Subtotal Venta
                doc.rect(135, yPos - 3, 30, 10);
                doc.text(`$${subtotalVenta.toFixed(2)}`, 140, yPos + 2, { align: 'center' });
                
                // Subtotal Mayor
                doc.rect(165, yPos - 3, 35, 10);
                doc.text(`$${subtotalMayor.toFixed(2)}`, 170, yPos + 2, { align: 'center' });
                
                yPos += 12;
                
                // Código en cuadro pequeño debajo
                doc.setFontSize(8);
                doc.setTextColor(100, 100, 100);
                doc.setFillColor(240, 240, 240);
                doc.rect(10, yPos - 5, 45, 6, 'F');
                doc.text(`Cód: ${item.codigo}`, 15, yPos - 1);
                
                doc.setFontSize(10);
                doc.setTextColor(0, 0, 0);
                yPos += 8;
            });
            
            yPos += 10;
            
            // Línea separadora
            doc.setDrawColor(150, 150, 150);
            doc.setLineWidth(0.5);
            doc.line(10, yPos, 200, yPos);
            yPos += 10;
            
            // Totales - AMBOS PRECIOS con cuadros
            doc.setFontSize(12);
            doc.setTextColor(44, 62, 80);
            doc.setFont(undefined, 'bold');
            
            // Cuadro para Total Venta
            doc.setFillColor(240, 240, 240);
            doc.rect(100, yPos - 3, 100, 8, 'F');
            doc.setDrawColor(200, 200, 200);
            doc.rect(100, yPos - 3, 100, 8);
            doc.text('TOTAL VENTA:', 105, yPos + 2);
            doc.text(`$${totalVenta.toFixed(2)}`, 185, yPos + 2, { align: 'right' });
            yPos += 12;
            
            // Cuadro para Total Mayor
            doc.setFillColor(240, 240, 240);
            doc.rect(100, yPos - 3, 100, 8, 'F');
            doc.setDrawColor(200, 200, 200);
            doc.rect(100, yPos - 3, 100, 8);
            doc.text('TOTAL MAYOR:', 105, yPos + 2);
            doc.text(`$${totalMayor.toFixed(2)}`, 185, yPos + 2, { align: 'right' });
            
            return doc;
        }

        // Función para descargar PDF
        function descargarPDF() {
            const doc = generarPDF();
            if (!doc) return;
            
            const fechaArchivo = new Date().toISOString().split('T')[0];
            const nombreCliente = nombreClienteInput.value || '';
            const nombreArchivo = nombreCliente ? 
                `jayden_${nombreCliente.replace(/\s+/g, '_')}_${fechaArchivo}.pdf` :
                `jayden_cotizacion_${fechaArchivo}.pdf`;
            
            doc.save(nombreArchivo);
            mostrarMensajeExito('PDF descargado');
        }

        // Función para guardar documento
        function guardarDocumento() {
            if (carrito.length === 0) {
                mostrarError('El carrito está vacío');
                return;
            }

            // Generar nombre único
            const fecha = new Date();
            const timestamp = fecha.getTime();
            const fechaFormateada = fecha.toLocaleDateString('es-ES');
            const horaFormateada = fecha.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            const nombreCliente = nombreClienteInput.value || 'Sin nombre';
            
            // Calcular totales
            let totalVenta = 0;
            let totalMayor = 0;
            let cantidadProductos = carrito.reduce((total, item) => total + item.cantidad, 0);
            
            carrito.forEach(item => {
                totalVenta += item.rgn1 * item.cantidad;
                totalMayor += item.rgn2 * item.cantidad;
            });

            const documentoData = {
                id: timestamp,
                nombre: `${nombreCliente} - ${fechaFormateada}`,
                fecha: fechaFormateada,
                hora: horaFormateada,
                cliente: nombreCliente,
                totalVenta: totalVenta,
                totalMayor: totalMayor,
                cantidadProductos: cantidadProductos,
                carrito: JSON.parse(JSON.stringify(carrito)), // Copia profunda del carrito
                pdfData: null // Se generará cuando se abra
            };
            
            // Agregar a la lista (al principio)
            documentosGuardados.unshift(documentoData);
            
            // Guardar en Local Storage
            guardarDocumentosEnStorage();
            
            // Actualizar lista visual
            actualizarListaDocumentos();
            
            // Mostrar sección de documentos
            documentosSection.style.display = 'block';
            
            mostrarMensajeExito('Documento guardado correctamente');
        }

        // Función para cargar documentos desde Local Storage
        function cargarDocumentosGuardados() {
            const documentosData = localStorage.getItem('jaydenDocumentos');
            if (documentosData) {
                documentosGuardados = JSON.parse(documentosData);
                
                if (documentosGuardados.length > 0) {
                    actualizarListaDocumentos();
                    documentosSection.style.display = 'block';
                }
            }
        }

        // Función para guardar documentos en Local Storage
        function guardarDocumentosEnStorage() {
            localStorage.setItem('jaydenDocumentos', JSON.stringify(documentosGuardados));
        }

        // Función para actualizar lista de documentos
        function actualizarListaDocumentos() {
            documentosLista.innerHTML = '';
            
            if (documentosGuardados.length === 0) {
                documentosLista.innerHTML = `
                    <div class="sin-documentos">
                        <div>📁</div>
                        <h4>No hay documentos guardados</h4>
                        <p>Guarda tu primer documento para verlo aquí</p>
                    </div>
                `;
                documentosSection.style.display = 'none';
                return;
            }
            
            // Filtrar si hay búsqueda
            const filtro = buscarDocumentoInput.value.toLowerCase();
            const documentosFiltrados = filtro ? 
                documentosGuardados.filter(doc => 
                    doc.nombre.toLowerCase().includes(filtro) ||
                    doc.cliente.toLowerCase().includes(filtro) ||
                    doc.fecha.toLowerCase().includes(filtro)
                ) : documentosGuardados;
            
            if (documentosFiltrados.length === 0) {
                documentosLista.innerHTML = `
                    <div class="sin-documentos">
                        <div>🔍</div>
                        <h4>No se encontraron documentos</h4>
                        <p>Intenta con otro término de búsqueda</p>
                    </div>
                `;
                return;
            }
            
            documentosFiltrados.forEach((doc, index) => {
                const docIndex = documentosGuardados.findIndex(d => d.id === doc.id);
                const documentoItem = document.createElement('div');
                documentoItem.className = 'documento-item';
                
                documentoItem.innerHTML = `
                    <div class="documento-info">
                        <div class="documento-nombre">${doc.nombre}</div>
                        <div class="documento-detalles">
                            <span class="documento-cliente">👤 ${doc.cliente}</span>
                            <span class="documento-fecha">📅 ${doc.fecha} - ${doc.hora}</span>
                            <span class="documento-productos">📦 ${doc.cantidadProductos} productos</span>
                            <span class="documento-fecha">💰 Venta: $${doc.totalVenta.toFixed(2)}</span>
                            <span class="documento-fecha">🏢 Mayor: $${doc.totalMayor.toFixed(2)}</span>
                        </div>
                    </div>
                    <div class="documento-acciones">
                        <button class="btn-abrir-documento" onclick="abrirDocumento(${docIndex})">
                            <span>👁️</span>
                            <span>Abrir</span>
                        </button>
                        <button class="btn-cargar-documento" onclick="cargarDesdeDocumento(${docIndex})">
                            <span>📂</span>
                            <span>Cargar</span>
                        </button>
                        <button class="btn-eliminar-documento" onclick="eliminarDocumento(${docIndex})">
                            <span>🗑️</span>
                            <span>Eliminar</span>
                        </button>
                    </div>
                `;
                
                documentosLista.appendChild(documentoItem);
            });
        }

        // Función para abrir documento
        function abrirDocumento(index) {
            if (index >= 0 && index < documentosGuardados.length) {
                const doc = documentosGuardados[index];
                
                // Generar el PDF si no existe
                if (!doc.pdfData) {
                    // Simular el carrito actual para generar PDF
                    const carritoOriginal = [...carrito];
                    const clienteOriginal = nombreClienteInput.value;
                    
                    // Temporalmente usar los datos del documento
                    carrito = [...doc.carrito];
                    nombreClienteInput.value = doc.cliente;
                    
                    const pdfDoc = generarPDF();
                    
                    // Restaurar estado original
                    carrito = carritoOriginal;
                    nombreClienteInput.value = clienteOriginal;
                    
                    if (pdfDoc) {
                        doc.pdfData = pdfDoc.output('datauristring');
                    }
                }
                
                // Mostrar en el visor
                visorTitulo.textContent = doc.nombre;
                
                if (doc.pdfData) {
                    visorBody.innerHTML = `
                        <iframe 
                            src="${doc.pdfData}" 
                            style="width: 100%; height: 100%; border: none;"
                        ></iframe>
                    `;
                } else {
                    // Mostrar información del documento si no hay PDF
                    let html = '<div style="padding: 20px;">';
                    html += `<h4>${doc.nombre}</h4>`;
                    html += `<p><strong>Cliente:</strong> ${doc.cliente}</p>`;
                    html += `<p><strong>Fecha:</strong> ${doc.fecha} ${doc.hora}</p>`;
                    html += `<p><strong>Total Venta:</strong> $${doc.totalVenta.toFixed(2)}</p>`;
                    html += `<p><strong>Total Mayor:</strong> $${doc.totalMayor.toFixed(2)}</p>`;
                    html += `<h5>Productos:</h5>`;
                    html += '<ul>';
                    
                    doc.carrito.forEach(item => {
                        html += `<li>${item.nombre} (Cód: ${item.codigo}) - ${item.cantidad} unidades</li>`;
                    });
                    
                    html += '</ul>';
                    html += '<button class="btn-abrir-documento" onclick="generarPDFDesdeDocumento(' + index + ')">';
                    html += '<span>📄</span> Generar PDF';
                    html += '</button>';
                    html += '</div>';
                    
                    visorBody.innerHTML = html;
                }
                
                visorDocumento.style.display = 'flex';
            }
        }

        // Función para generar PDF desde documento
        function generarPDFDesdeDocumento(index) {
            if (index >= 0 && index < documentosGuardados.length) {
                const doc = documentosGuardados[index];
                
                // Guardar estado actual
                const carritoOriginal = [...carrito];
                const clienteOriginal = nombreClienteInput.value;
                
                // Usar datos del documento
                carrito = [...doc.carrito];
                nombreClienteInput.value = doc.cliente;
                
                // Generar y descargar PDF
                const pdfDoc = generarPDF();
                if (pdfDoc) {
                    pdfDoc.save(`jayden_${doc.cliente}_${doc.fecha}.pdf`);
                }
                
                // Restaurar estado original
                carrito = carritoOriginal;
                nombreClienteInput.value = clienteOriginal;
                
                // Actualizar el documento con el PDF generado
                if (pdfDoc && !doc.pdfData) {
                    doc.pdfData = pdfDoc.output('datauristring');
                    guardarDocumentosEnStorage();
                }
            }
        }

        // Función para cargar desde documento
        function cargarDesdeDocumento(index) {
            if (index >= 0 && index < documentosGuardados.length) {
                const doc = documentosGuardados[index];
                
                if (confirm('¿Cargar este documento en el carrito actual? Se perderán los productos actuales.')) {
                    carrito = [...doc.carrito];
                    nombreClienteInput.value = doc.cliente;
                    
                    guardarDatosEnStorage();
                    actualizarCarrito();
                    
                    mostrarMensajeExito('Documento cargado en el carrito');
                    cerrarVisor();
                }
            }
        }

        // Función para eliminar documento
        function eliminarDocumento(index) {
            if (index >= 0 && index < documentosGuardados.length) {
                const doc = documentosGuardados[index];
                
                if (confirm(`¿Estás seguro de eliminar el documento "${doc.nombre}"?`)) {
                    documentosGuardados.splice(index, 1);
                    guardarDocumentosEnStorage();
                    actualizarListaDocumentos();
                    mostrarMensajeExito('Documento eliminado');
                }
            }
        }

        // Función para limpiar todos los documentos
        function limpiarDocumentos() {
            if (documentosGuardados.length === 0) {
                mostrarError('No hay documentos para limpiar');
                return;
            }
            
            if (confirm('¿Estás seguro de eliminar TODOS los documentos guardados? Esta acción no se puede deshacer.')) {
                documentosGuardados = [];
                localStorage.removeItem('jaydenDocumentos');
                actualizarListaDocumentos();
                mostrarMensajeExito('Todos los documentos han sido eliminados');
            }
        }

        // Función para cerrar el visor
        function cerrarVisor() {
            visorDocumento.style.display = 'none';
            visorBody.innerHTML = '';
        }

        // Event listener para búsqueda en documentos
        buscarDocumentoInput.addEventListener('input', function() {
            actualizarListaDocumentos();
        });

        // Función para enviar por WhatsApp (el usuario elige qué precio enviar)
        function enviarWhatsApp(tipo) {
            if (carrito.length === 0) {
                mostrarError('El carrito está vacío');
                return;
            }

            const nombreCliente = nombreClienteInput.value || '';
            const tipoPrecioTexto = tipo === 'venta' ? 'Venta' : 'Mayor';
            
            let mensaje = `🛒 *PEDIDO JAYDEN COMPAÑY* 🛒\n\n`;
            
            if (nombreCliente) {
                mensaje += `👤 *Cliente:* ${nombreCliente}\n`;
            }
            
            mensaje += `💰 *Precio:* ${tipoPrecioTexto}\n\n`;
            mensaje += `📋 *DETALLE DEL PEDIDO:*\n\n`;

            let totalSeleccionado = 0;
            let numeroItem = 1;

            carrito.forEach(item => {
                const precio = tipo === 'venta' ? item.rgn1 : item.rgn2;
                const subtotal = precio * item.cantidad;
                totalSeleccionado += subtotal;
                
                mensaje += `*${numeroItem}. ${item.nombre}*\n`;
                mensaje += `   📦 Código: ${item.codigo}\n`;
                mensaje += `   🔢 Cantidad: ${item.cantidad}\n`;
                mensaje += `   💰 Precio ${tipoPrecioTexto}: $${precio.toFixed(2)} c/u\n`;
                mensaje += `   🧮 Subtotal: $${subtotal.toFixed(2)}\n\n`;
                
                numeroItem++;
            });

            mensaje += "━━━━━━━━━━━━━━━━\n";
            mensaje += `💰 *TOTAL ${tipoPrecioTexto.toUpperCase()}: $${totalSeleccionado.toFixed(2)}*\n`;
            mensaje += "━━━━━━━━━━━━━━━━\n\n";
            mensaje += "📞 Cliente espera confirmación\n";
            mensaje += "⏰ Por favor confirmar disponibilidad\n\n";
            mensaje += "¡Gracias! 🙏";

            // Codificar mensaje para URL
            const mensajeCodificado = encodeURIComponent(mensaje);
            const numeroWhatsApp = "593986122265";
            
            // Crear URL de WhatsApp
            const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`;
            
            // Abrir en nueva ventana
            window.open(urlWhatsApp, '_blank');
            
            mostrarMensajeExito(`Pedido enviado como ${tipoPrecioTexto}`);
        }

        // Función para mostrar mensaje de éxito
        function mostrarMensajeExito(mensaje) {
            const alerta = document.createElement('div');
            alerta.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #2ecc71;
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 1000;
                animation: slideIn 0.3s ease;
                max-width: 90%;
                word-wrap: break-word;
            `;
            alerta.textContent = mensaje;
            document.body.appendChild(alerta);

            setTimeout(() => {
                alerta.remove();
            }, 3000);
        }

        // Función para mostrar error
        function mostrarError(mensaje) {
            resultSection.innerHTML = `
                <div class="error-message">
                    <h3>❌ Error</h3>
                    <p>${mensaje}</p>
                </div>
            `;
            resultSection.style.display = 'block';
        }

        // Función para usar ejemplos
        function usarEjemplo(codigo) {
            codigoInput.value = codigo;
            buscarProducto();
        }

        // Event listeners
        buscarBtn.addEventListener('click', buscarProducto);
        
        codigoInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarProducto();
            }
        });

        // Guardar automáticamente cuando se escribe el nombre
        nombreClienteInput.addEventListener('input', function() {
            guardarDatosEnStorage();
        });

        // Cerrar visor con ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                cerrarVisor();
            }
        });

        // Enfocar el input al cargar la página
        window.addEventListener('load', function() {
            codigoInput.focus();
        });

        // Mostrar cantidad de productos cargados
        console.log(`✅ Base de datos cargada: ${Object.keys(productos).length} productos disponibles`);
    </script>
</body>
</html>
